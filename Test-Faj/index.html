<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Défis Photobooth</title>
<meta name="theme-color" content="#140c26" id="couleurTheme">
<meta name="robots" content="noindex">
<script>
  // Si le téléphone affiche la page en « version ordinateur », on la recale sur la largeur réelle de l'écran.
  (function () {
    var w = screen.width;
    if (navigator.maxTouchPoints > 0 && w < 700 && window.innerWidth > w * 1.4) {
      document.documentElement.classList.add('mode-pc');
      document.documentElement.style.setProperty('--k', window.innerWidth / w);
    }
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,700;1,9..144,800&family=Cormorant+Garamond:ital,wght@1,600;1,700&family=Fredoka:wght@600;700&family=Creepster&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<!-- Réglages du jeu de ce client : thème, couleurs, textes, défis. Absent = jeu standard. -->
<script src="config.js"></script>
<style>
  /* Valeurs par défaut = thème « Soirée disco ». Chaque thème les remplace (voir THEMES dans le script). */
  :root {
    --nuit: #140c26; --nuit-2: #26123d; --halo-1: #3a1a55; --halo-2: #4a1240;
    --texte: #fbf3e4; --brume: #b9a9d3; --surtitre: #f3d27a;
    --or: #e9b44c; --or-clair: #f3d27a; --champagne: #fff1c9; --or-fonce: #8a5f20;
    --fuchsia: #ff3d8b; --fuchsia-2: #b4248f; --fuchsia-clair: #ff9cc4;
    --carte-1: rgba(52,26,82,.92); --carte-2: rgba(26,13,46,.94); --texte-carte: #fbf3e4;
    --titre-degrade: linear-gradient(100deg, #b8862f 0%, #fff1c9 30%, #e9b44c 52%, #fff1c9 72%, #b8862f 100%);
    --titre-police: 'Fraunces', Georgia, serif; --titre-style: italic; --titre-poids: 800; --titre-taille: 1;
    --titre-halo: rgba(233,180,76,.25);
    --logo-filtre: brightness(0) invert(1) drop-shadow(0 0 10px rgba(255,241,201,.35)) drop-shadow(0 2px 6px rgba(0,0,0,.4));
    --ampoule: #fff1c9; --ampoule-2: #e9b44c;
    --ombre: rgba(0,0,0,.5);
    --bouton-texte: #2a1608;
    --police: 'Outfit', system-ui, -apple-system, sans-serif;
    --fig: clamp(64px, 11dvh, 88px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; background: var(--nuit); }
  body {
    font-family: var(--police);
    min-height: 100vh; min-height: 100dvh;
    background:
      radial-gradient(120% 70% at 50% 0%, var(--halo-1) 0%, transparent 60%),
      radial-gradient(90% 60% at 50% 110%, var(--halo-2) 0%, transparent 65%),
      linear-gradient(180deg, var(--nuit-2), var(--nuit));
    background-color: var(--nuit);
    background-attachment: fixed;
    color: var(--texte);
    text-align: center;
    display: flex; justify-content: center;
    overflow-x: hidden;
    padding: max(12px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    transition: background-color .4s;
  }
  html.mode-pc body { width: calc(100vw / var(--k)); min-height: calc(100vh / var(--k)); transform: scale(var(--k)); transform-origin: 0 0; }

  /* ===== Décors ===== */
  .decor { position: fixed; pointer-events: none; z-index: 0; }
  #lumieres { inset: 0; width: 100%; height: 100%; }
  .fond { inset: 0; width: 100%; height: 100%; opacity: .75; }
  .serpentin { top: 0; width: clamp(70px, 20vw, 110px); height: auto; }
  .serpentin.gauche { left: 0; }
  .serpentin.droite { right: 0; transform: scaleX(-1); }
  .disco { top: 0; right: clamp(6px, 3vw, 40px); width: clamp(46px, 12vw, 70px); height: auto; transform-origin: 50% 0; animation: balance 5s ease-in-out infinite; filter: drop-shadow(0 4px 14px rgba(0,0,0,.3)); }
  .disco.ballons { width: clamp(56px, 15vw, 84px); right: clamp(4px, 2vw, 30px); animation: flotte-ballons 6s ease-in-out infinite; transform-origin: 50% 100%; }
  .guirlande { top: 0; left: 0; width: 100%; height: clamp(60px, 11dvh, 90px); }
  .eclat { transform-box: fill-box; transform-origin: center; animation: eclat 2.4s ease-in-out infinite; }
  .etoile { transform-box: fill-box; transform-origin: center; animation: scintille 3s ease-in-out infinite; animation-delay: var(--d); }
  @keyframes balance { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
  @keyframes flotte-ballons { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-6px) rotate(3deg); } }
  @keyframes eclat { 0%,100% { opacity: .2; transform: scale(.5); } 50% { opacity: 1; transform: scale(1.1); } }
  @keyframes scintille { 0%,100% { opacity: .25; transform: scale(.6); } 50% { opacity: 1; transform: scale(1); } }
  /* Couleur d'accent appliquée aux décors du thème disco */
  .decor [fill="#ff3d8b"], .appareil [fill="#ff3d8b"] { fill: var(--fuchsia); }
  .decor [stroke="#ff3d8b"] { stroke: var(--fuchsia); }
  .decor [fill="#ff9cc4"] { fill: var(--fuchsia-clair); }
  .flamme { transform-box: fill-box; transform-origin: 50% 100%; animation: flamme .9s ease-in-out infinite alternate; }
  @keyframes flamme { from { transform: scaleY(.85) skewX(-4deg); opacity: .85; } to { transform: scaleY(1.1) skewX(4deg); opacity: 1; } }
  .lueur { animation: lueur 2.2s ease-in-out infinite; }
  @keyframes lueur { 0%,100% { opacity: .75; filter: drop-shadow(0 0 2px #ffd166); } 50% { opacity: 1; filter: drop-shadow(0 0 7px #ffb703); } }

  main { position: relative; z-index: 1; width: 100%; max-width: 420px; min-height: calc(100dvh - max(12px, env(safe-area-inset-top)) - max(16px, env(safe-area-inset-bottom))); display: flex; flex-direction: column; align-items: center; gap: clamp(8px, 1.6dvh, 14px); }
  .jeu { width: 100%; display: flex; flex-direction: column; align-items: center; gap: clamp(8px, 1.6dvh, 14px); margin-block: auto; }
  header { display: flex; flex-direction: column; align-items: center; gap: clamp(6px, 1.2dvh, 10px); }
  .plaque { margin-top: clamp(10px, 2.2dvh, 22px); margin-bottom: clamp(4px, 1dvh, 10px); }
  html.avec-guirlande .plaque { margin-top: clamp(40px, 8dvh, 64px); }
  .logo { display: block; width: clamp(170px, 25dvh, 240px); max-width: 66vw; height: auto; filter: var(--logo-filtre); }

  .titres { display: flex; flex-direction: column; align-items: center; gap: clamp(6px, 1.2dvh, 10px); }
  .surtitre { font-size: .72rem; font-weight: 600; letter-spacing: .32em; text-transform: uppercase; color: var(--surtitre); margin-top: clamp(4px, 1dvh, 10px); text-wrap: balance; }
  .surtitre[hidden] { display: none; }
  h1 {
    font-family: var(--titre-police); font-style: var(--titre-style); font-weight: var(--titre-poids);
    font-size: calc(clamp(2rem, 5.6dvh, 2.7rem) * var(--titre-taille)); line-height: 1.05; letter-spacing: -.01em; text-wrap: balance;
    background: var(--titre-degrade);
    background-size: 220% 100%;
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: var(--or);
    animation: reflet 6s linear infinite;
    filter: drop-shadow(0 2px 10px var(--titre-halo));
    padding: 0 .08em;
  }
  @keyframes reflet { from { background-position: 100% 0; } to { background-position: -120% 0; } }
  .subtitle { font-size: clamp(.95rem, 2.3dvh, 1.05rem); color: var(--brume); }

  .piece { position: relative; width: 100%; margin: calc(var(--fig) * .95) 0 clamp(6px, 1.6dvh, 16px); }
  .bulle { animation: monte 2.2s ease-in infinite; animation-delay: var(--d); }
  .tchin { animation: tchin 2.4s ease-in-out infinite; transform-origin: 65px 4px; }
  @keyframes monte { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(-20px); opacity: 0; } }
  @keyframes tchin { 0%,60%,100% { opacity: 0; transform: scale(.6); } 75% { opacity: 1; transform: scale(1); } }

  .card {
    position: relative; z-index: 1;
    width: 100%;
    min-height: clamp(140px, 22dvh, 200px);
    display: flex; align-items: center; justify-content: center;
    padding: 32px 22px 24px;
    font-family: var(--police); font-size: clamp(1.25rem, 3dvh, 1.55rem); font-weight: 600; line-height: 1.35;
    text-wrap: balance; overflow-wrap: anywhere;
    color: var(--texte-carte);
    border: 2px solid transparent; border-radius: 22px;
    background:
      linear-gradient(160deg, var(--carte-1), var(--carte-2)) padding-box,
      linear-gradient(135deg, var(--champagne), var(--or) 35%, var(--or-fonce) 55%, var(--or-clair) 80%, var(--fuchsia)) border-box;
    box-shadow: 0 14px 40px var(--ombre), inset 0 1px 0 rgba(255,241,201,.12);
    transition: transform .4s cubic-bezier(.175,.885,.32,1.275), box-shadow .3s;
  }
  .card.placeholder { font-weight: 400; color: var(--brume); }
  .card.stopped { transform: scale(1.03); box-shadow: 0 0 0 1px rgba(243,210,122,.4), 0 0 38px rgba(233,180,76,.45), 0 14px 40px var(--ombre); }
  .texte { display: block; }

  button {
    position: relative; overflow: hidden;
    width: 100%; min-height: 60px; margin-top: 4px; padding: 16px 0;
    font-family: var(--police); font-size: 1.1rem; font-weight: 700; letter-spacing: .22em; text-transform: uppercase;
    color: var(--bouton-texte);
    background: linear-gradient(180deg, var(--champagne) 0%, var(--or-clair) 35%, var(--or) 70%, var(--or-fonce) 130%);
    border: none; border-radius: 50px; cursor: pointer;
    touch-action: manipulation; -webkit-user-select: none; user-select: none;
    box-shadow: 0 8px 24px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.7);
    transition: transform .2s, box-shadow .3s;
  }
  button:active { transform: scale(.97); }
  button:focus-visible { outline: 3px solid var(--champagne); outline-offset: 3px; }
  @media (hover: hover) { button:hover { box-shadow: 0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.7); transform: translateY(-2px); } }
  button.running { color: #fff; background: linear-gradient(135deg, var(--fuchsia) 0%, var(--fuchsia-2) 100%); box-shadow: 0 8px 24px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.3); }
  button:disabled { opacity: .4; cursor: not-allowed; transform: none; box-shadow: none; }
  button::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.55) 50%, transparent 65%) no-repeat;
    background-size: 250% 100%; background-position: 160% 0;
    animation: reflet-bouton 3.6s ease-in-out infinite;
  }
  button.running::after { animation: none; }
  @keyframes reflet-bouton { 0%, 55% { background-position: 160% 0; } 100% { background-position: -60% 0; } }

  /* Objet posé sur la carte (appareil photo, gâteau, flûtes…) */
  .appareil { position: absolute; right: 6px; bottom: calc(100% - 14px); width: calc(var(--fig) * 1.2); height: auto; z-index: 3; filter: drop-shadow(0 6px 10px rgba(0,0,0,.35)); animation: flotte 4s ease-in-out infinite; }
  @keyframes flotte { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-5px) rotate(2deg); } }
  .flash-lampe { animation: lampe 3.2s ease-in-out infinite; }
  .flash-eclat { transform-origin: 93px 22px; animation: eclair 3.2s ease-out infinite; }
  @keyframes lampe { 0%,82%,100% { fill: #fff6dd; } 86% { fill: #fff; filter: drop-shadow(0 0 6px #fff); } }
  @keyframes eclair { 0%,82%,100% { opacity: 0; transform: scale(.5); } 86% { opacity: 1; transform: scale(1.1); } 95% { opacity: 0; transform: scale(1.3); } }

  /* Guirlande d'ampoules autour de la carte */
  .marquee { position: absolute; inset: -12px; width: calc(100% + 24px); height: calc(100% + 24px); overflow: visible; pointer-events: none; }
  .ampoules { fill: none; stroke: var(--ampoule); stroke-width: 6; stroke-linecap: round; stroke-dasharray: 0 18; filter: drop-shadow(0 0 4px var(--ampoule)); animation: chenille 1.6s linear infinite; }
  .ampoules.bis { stroke: var(--ampoule-2); stroke-dashoffset: 9; opacity: .45; filter: none; animation-name: chenille-bis; }
  @keyframes chenille { to { stroke-dashoffset: -18; } }
  @keyframes chenille-bis { from { stroke-dashoffset: 9; } to { stroke-dashoffset: -9; } }
  .card.roule .ampoules { stroke: var(--fuchsia); animation-duration: .35s; filter: drop-shadow(0 0 6px var(--fuchsia)); }
  .card.roule .ampoules.bis { stroke: var(--fuchsia-clair); }
  .card.stopped .ampoules { animation: chenille .9s linear infinite, clignote .45s steps(1) 4; filter: drop-shadow(0 0 7px var(--ampoule)); }
  @keyframes clignote { 50% { opacity: .25; } }

  .etiquette {
    position: absolute; top: -15px; left: 22px; z-index: 2;
    padding: 5px 14px;
    font-family: var(--police); font-size: .72rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase;
    color: var(--bouton-texte);
    background: linear-gradient(180deg, var(--champagne), var(--or));
    border-radius: 999px;
    box-shadow: 0 4px 12px rgba(0,0,0,.25);
    transform: rotate(-3deg);
  }
  .card.roule .etiquette { color: #fff; background: linear-gradient(135deg, var(--fuchsia), var(--fuchsia-2)); }

  .card.roule .texte { animation: defile .07s linear infinite; }
  @keyframes defile { from { transform: translateY(-7px); opacity: .55; filter: blur(.7px); } to { transform: translateY(7px); opacity: 1; filter: blur(0); } }
  .card.stopped .texte { animation: revele .55s cubic-bezier(.2,1.5,.4,1); }
  @keyframes revele { from { transform: scale(.6); opacity: 0; filter: blur(5px); } }
  .card::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: linear-gradient(105deg, transparent 38%, rgba(255,241,201,.28) 50%, transparent 62%) no-repeat;
    background-size: 250% 100%; background-position: 160% 0; opacity: 0;
  }
  .card.stopped::after { animation: reflet-carte 1.1s ease-out .15s; }
  @keyframes reflet-carte { 0% { opacity: 1; background-position: 160% 0; } 100% { opacity: 1; background-position: -60% 0; } }

  .flash-ecran { position: fixed; inset: 0; z-index: 5; background: #fff; opacity: 0; pointer-events: none; }
  .flash-ecran.go { animation: flash-ecran .5s ease-out; }
  @keyframes flash-ecran { 0% { opacity: .75; } 100% { opacity: 0; } }

  .aide { min-height: 1.3em; font-size: .85rem; color: var(--brume); opacity: .85; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  .bouton-site { display: inline-flex; align-items: center; justify-content: center; width: 100%; min-height: 60px; margin-top: 8px; padding: 16px 20px;
    font-family: var(--police); font-size: 1rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; text-decoration: none;
    color: var(--bouton-texte); background: linear-gradient(180deg, var(--champagne) 0%, var(--or-clair) 35%, var(--or) 70%, var(--or-fonce) 130%);
    border-radius: 50px; box-shadow: 0 8px 24px rgba(0,0,0,.28); }
  .fin-jeu { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .fin-jeu .emoji-fin { font-size: 3rem; }
</style>
</head>

<div id="decor" aria-hidden="true"></div>

<div class="flash-ecran" id="flash" aria-hidden="true"></div>
<main>

  const Particules = (function () {

    function taille() {

      pts = Array.from({ length: reglage.n }, () => creer(reglage.type, reglage.teintes, true));

    }

          ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();

  function appliquerTheme(nom, perso) {

  function verifierExpiration(cfg) {

      "Prends la pose de la star de la soirée",
      "Fais un cœur avec tes mains",
      "Faites tous la même grimace",
      "Regardez tous dans une direction différente",
      "Faites tous semblant d'être très en colère",
      "Faites tous semblant de dormir",
      "Faites un câlin groupé",
      "Posez dos à dos façon agents secrets",
      "Prenez la pose d'un groupe de rock",
      "Faites une photo de classe très sérieuse",
      "Faites un grand cœur avec vos bras",
      "Faites tous le même pas de danse en même temps",
      "Les trois singes : je ne vois rien, je n'entends rien, je ne dis rien",
      "L'un rit aux éclats, l'autre pleure à chaudes larmes",
      "Faites discrètement des oreilles de lapin à votre voisin",
      "Posez comme la famille royale au balcon",
      "Faites semblant de vous disputer la meilleure place",
      "Sautez tous en même temps !"
    ];

    // ---- Pioche mélangée ----
    // Les défis sont mélangés comme un jeu de cartes (mélange de Fisher-Yates, avec le générateur
    // aléatoire sécurisé du navigateur). On pioche dans l'ordre : aucun défi ne revient avant que
    // tous soient passés. La pioche est mémorisée sur l'appareil : elle survit à un rechargement
    // de la page (par exemple après le QR code), donc on ne repart pas toujours des mêmes défis.
    const CLE = 'defis-perso-pioche-v2:' + location.pathname;
    let pioche = [];   // défis dans l'ordre du mélange
    let position = 0;  // prochain défi à tirer

    function hasard(n) {
      // Entier aléatoire équitable entre 0 et n-1
      if (window.crypto && crypto.getRandomValues) {
        const max = Math.floor(0x100000000 / n) * n;
        const buf = new Uint32Array(1);
        do { crypto.getRandomValues(buf); } while (buf[0] >= max);
        return buf[0] % n;
      }
      return Math.floor(Math.random() * n);
    }

    function melanger(liste) {
      const a = [...liste];
      for (let i = a.length - 1; i > 0; i--) {
        const j = hasard(i + 1);
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function sauver() {
      try { localStorage.setItem(CLE, JSON.stringify({ pioche, position })); } catch (e) {}
    }

    function nouvellePioche(dernier) {
      pioche = melanger(tousLesDefis);
      // Le premier défi du nouveau tour ne doit pas être celui qui vient de sortir
      if (dernier && pioche[0] === dernier && pioche.length > 1) {
        const j = 1 + hasard(pioche.length - 1);
        [pioche[0], pioche[j]] = [pioche[j], pioche[0]];
      }
      position = 0;
    }

    function chargerPioche() {
      try {
        const sauvegarde = JSON.parse(localStorage.getItem(CLE));
        // On réutilise la pioche seulement si la liste de défis n'a pas changé
        const memeListe = sauvegarde
          && Array.isArray(sauvegarde.pioche)
          && sauvegarde.pioche.length === tousLesDefis.length
          && sauvegarde.pioche.every(d => tousLesDefis.includes(d))
          && Number.isInteger(sauvegarde.position);
        if (memeListe) {
          pioche = sauvegarde.pioche;
          position = sauvegarde.position;
          return;
        }
      } catch (e) {}
      nouvellePioche(null);
      sauver();
    }

    function piocherDefi() {
      if (position >= pioche.length) nouvellePioche(pioche[pioche.length - 1]);
      const d = pioche[position++];
      sauver();
      return d;
    }

    // ================= PERSONNALISATION =================
    // Les réglages viennent de config.js (window.DEFIBOOTH_CONFIG). Sans réglage : jeu standard, thème disco.
    const DEFIS_STANDARD = tousLesDefis.slice();

    function appliquerConfig(cfg) {
      cfg = cfg || {};
      appliquerTheme(cfg.theme, cfg.couleurs);
      appliquerTextes(cfg);
      const liste = Array.isArray(cfg.defis)
        ? [...new Set(cfg.defis.map(d => texteNettoye(d, 120)).filter(Boolean))]
        : [];
      tousLesDefis = liste.length >= 2 ? liste : DEFIS_STANDARD.slice();
      verifierExpiration(cfg);
    }

    appliquerConfig(window.DEFIBOOTH_CONFIG);

    // Mode aperçu : le générateur envoie ses réglages en direct à cette page affichée dans un cadre.
    if (new URLSearchParams(location.search).has('apercu')) {
      addEventListener('message', function (e) {
        if (e.origin !== location.origin) return;
        if (!e.data || e.data.type !== 'defibooth-config') return;
        appliquerConfig(e.data.config);
        reinitialiserPartie();
      });
      if (window.parent !== window) window.parent.postMessage({ type: 'defibooth-pret' }, location.origin);
    }
    // =====================================================

    chargerPioche();

    // Tirage illimité : plus de limite ni de QR code.
    // On efface l'ancien compteur que la version limitée a pu laisser sur le téléphone.
    try { localStorage.removeItem('defis-anniv-compteur-v1'); } catch (e) {}

    const card = document.getElementById('card');
    const texte = document.getElementById('texte');
    const etiquette = document.getElementById('etiquette');
    const aide = document.getElementById('aide');
    const flash = document.getElementById('flash');
    const btn = document.getElementById('actionBtn');
    const calmeAnim = matchMedia('(prefers-reduced-motion: reduce)').matches;
    let intervalId = null;
    let isRunning = false;
    let ralentit = false;
    let affiche = null;
    let numero = 0;

    // Pendant le défilement : simple effet visuel, le vrai défi est tiré au STOP
    function defilement() {
      let d;
      do {
        d = tousLesDefis[hasard(tousLesDefis.length)];
      } while (d === affiche && tousLesDefis.length > 1);
      affiche = d;
      texte.textContent = d;
    }

    // Couleurs de fête
    const confettiColors = ['#f3d27a', '#e9b44c', '#fff1c9', '#e8a3a0', '#ff3d8b', '#43d9c4', '#ffffff'];

    function launchConfetti() {
      if (typeof confetti !== "function" || calmeAnim) return;

      confetti({ particleCount: 200, spread: 100, startVelocity: 45, origin: { y: 0.6 }, colors: couleursConfettis });
      confetti({ particleCount: 60, spread: 120, startVelocity: 35, shapes: ['star'], scalar: 1.1, origin: { y: 0.6 }, colors: couleursConfettis.slice(0, 2) });
      confetti({ particleCount: 100, spread: 160, startVelocity: 30, scalar: 1.2, origin: { y: 0.6 }, colors: couleursConfettis });

      const end = Date.now() + 2000;
      (function frame() {
        confetti({ particleCount: 6, angle: 60, spread: 60, origin: { x: 0, y: 0.7 }, colors: couleursConfettis });
        confetti({ particleCount: 6, angle: 120, spread: 60, origin: { x: 1, y: 0.7 }, colors: couleursConfettis });
        if (Date.now() < end) requestAnimationFrame(frame);
      })();
    }

    // Affichage du défi tiré, après le ralentissement
    function reveler() {
      ralentit = false;
      // Le vrai défi est pioché dans la pioche mélangée
      texte.textContent = piocherDefi();
      numero++;
      etiquette.textContent = 'Défi n°' + numero;
      aide.textContent = "À toi de jouer devant l'objectif !";
      btn.textContent = "Recommencer";
      btn.classList.remove('running');
      card.classList.remove('roule');
      card.classList.add('stopped');
      if (!calmeAnim) { flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go'); }
      if (navigator.vibrate) navigator.vibrate(60);
      launchConfetti();
    }

    function reinitialiserPartie() {
      clearInterval(intervalId);
      isRunning = false; ralentit = false; affiche = null; numero = 0;
      nouvellePioche(null); sauver();
      card.className = 'card placeholder';
      etiquette.textContent = 'Prêt(e) ?';
      texte.textContent = 'Touche le bouton pour lancer';
      aide.textContent = 'Les défis vont défiler… arrête-les au bon moment !';
      btn.textContent = 'Lancer';
      btn.className = '';
    }

    function toggleLoop() {
      if (ralentit) return;
      if (isRunning) {
        clearInterval(intervalId);
        isRunning = false;
        ralentit = true;
        etiquette.textContent = 'Suspense…';
        // Réaction immédiate à l'appui : le bouton change et le téléphone vibre tout de suite
        btn.textContent = "…";
        btn.classList.remove('running');
        btn.classList.add('attente');
        if (navigator.vibrate) navigator.vibrate(25);
        // Ralentissement court (≈ 0,5 s) façon machine à sous avant de révéler le défi
        const delais = calmeAnim ? [] : [60, 100, 150, 210];
        let i = 0;
        (function etape() {
          if (i < delais.length) { defilement(); setTimeout(etape, delais[i++]); }
          else reveler();
        })();
      } else {
        isRunning = true;
        btn.textContent = "Stop !";
        btn.classList.add('running');
        etiquette.textContent = 'Ça tourne…';
        aide.textContent = "Touche « Stop ! » pour découvrir ton défi";
        card.classList.remove('stopped', 'placeholder');
        card.classList.add('roule');
        intervalId = setInterval(defilement, 60);
      }
    }
</script>

</body>
</html>
